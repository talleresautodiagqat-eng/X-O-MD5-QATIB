name: XO MD5 QATIB - Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Crear APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e
          mkdir -p www
          cp "preview (1).html" "www/index.html"

          cat > package.json <<'EOF'
          {
            "name": "xo-md5-qatib",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mouadqatib.xomd5qatib",
            "appName": "XO MD5 QATIB",
            "webDir": "www"
          }
          EOF

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar aplicación
        run: npx cap sync android

      - name: Crear APK
        shell: bash
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK para descargar
        shell: bash
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk XO-MD5-QATIB.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: XO-MD5-QATIB-APK
          path: XO-MD5-QATIB.apk
          if-no-files-found: error
          retention-days: 90
